<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lilyum</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,500&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse 90% 60% at 50% 105%,#4a1f63 0%,transparent 70%),radial-gradient(ellipse 70% 50% at 20% 0%,#1d2a5e 0%,transparent 70%),linear-gradient(#0b0820,#120a2b 60%,#1b0d33);font-family:'Cormorant Garamond',Georgia,serif;color:#ffe9f1;-webkit-tap-highlight-color:transparent}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#stars,#fx,#bokeh{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:0;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0}50%{opacity:.85}}
.bk{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,170,205,.28),rgba(255,170,205,0) 70%)}
@keyframes drift{to{transform:translate(var(--x),var(--y))}}
#mist{position:fixed;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,rgba(160,90,200,.22));pointer-events:none}
svg#s{position:fixed;left:50%;top:2%;height:76%;transform:translateX(-50%);overflow:visible}
.run .stem{stroke-dasharray:380;stroke-dashoffset:380;animation:grow 3.4s .9s cubic-bezier(.4,0,.2,1) forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.seed{animation:seed 1.4s ease-out both}
@keyframes seed{0%{opacity:0;transform:translateY(-160px)}70%{opacity:1}100%{opacity:1;transform:none}}
.leaf,.petal,.bud,.st{transform:scale(0);transform-box:view-box}
.run .leaf{animation:pop 2s var(--d) cubic-bezier(.2,.8,.3,1) forwards}
.run .bud{animation:bud 2.4s 4s ease-out forwards}
.run .petal{animation:open 2.8s var(--d) cubic-bezier(.2,.9,.3,1.1) forwards}
.run .st{animation:pop 1.8s var(--d) ease-out forwards}
.petal use[fill]{stroke:#fff;stroke-opacity:.38;stroke-width:.9}

#moon{position:fixed;top:calc(env(safe-area-inset-top,0px) + 5%);right:9%;width:clamp(56px,16vw,90px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fffdf0,#f6ebc2 55%,#d8c98e);box-shadow:0 0 40px 12px rgba(255,240,190,.35),0 0 120px 40px rgba(255,230,170,.18);opacity:0;animation:mi 5s 1s ease-out forwards;pointer-events:none}
@keyframes mi{to{opacity:.95}}
#moon::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 38%,rgba(150,130,80,.3) 0 9%,transparent 10%),radial-gradient(circle at 35% 65%,rgba(150,130,80,.25) 0 12%,transparent 13%),radial-gradient(circle at 70% 72%,rgba(150,130,80,.2) 0 6%,transparent 7%)}
#gr{position:fixed;left:0;right:0;top:72%;width:100%;height:28%;pointer-events:none;overflow:visible}

#gr .b{animation:none}
@keyframes gw{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes gu{to{transform:scaleY(1)}}
.ff{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff6a8;box-shadow:0 0 10px 4px rgba(255,240,120,.8);opacity:0;animation:ffm ease-in-out infinite alternate,ffb ease-in-out infinite}
@keyframes ffm{to{transform:translate(var(--x),var(--y))}}
@keyframes ffb{0%,100%{opacity:.1}50%{opacity:1}}
.pt{position:absolute;border-radius:70% 0 70% 30%;background:linear-gradient(#ffd0e2,#ff8fbe);opacity:0;animation:fall linear forwards;will-change:transform}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.9}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.pl{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 6px 2px rgba(255,220,120,.8);opacity:0;animation:pu ease-out forwards}
@keyframes pu{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y))}}
.sh{position:absolute;height:2px;width:110px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:2px;opacity:0;animation:sh 1.4s ease-out forwards}
@keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(var(--r))}10%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.bh{position:absolute;animation:bh 1.3s ease-out forwards}
@keyframes bh{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1)}}
@keyframes pop{to{transform:scale(1)}}
@keyframes bud{0%{transform:scale(0)}55%{transform:scale(1);opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes open{from{transform:scale(0) rotate(var(--o))}to{transform:scale(1) rotate(0)}}
.run .plant{}
@keyframes sway{0%,100%{rotate:-2deg}50%{rotate:2.2deg}}
svg#s.run{transform-origin:50% 97%;will-change:transform;animation:sway 6s 9s ease-in-out infinite}
.glow{opacity:0}
.run .glow{animation:gl 4s 6s ease-in-out forwards}
@keyframes gl{from{opacity:.2}to{opacity:.6}}
#msg{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 1.5%);padding:0 6%;text-align:center;font-family:'Lora',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(15px,4vw,24px);line-height:1.5;min-height:4.5em;color:#ffeef5;text-shadow:0 0 18px rgba(255,130,180,.7)}
.fl{position:absolute;bottom:-40px;animation:up linear forwards;will-change:transform;opacity:.8}
@keyframes up{0%{opacity:0}10%{opacity:.9}70%{opacity:.9}to{transform:translate(var(--x),-110vh) rotate(var(--r));opacity:0}}
.bf{position:absolute;width:44px;height:36px;animation:fly ease-in-out infinite alternate;will-change:transform}
.bf .w{animation:flap .45s ease-in-out infinite alternate;transform-origin:22px 18px}
@keyframes flap{to{transform:scaleX(.25)}}
@keyframes fly{0%{transform:translate(0,0) rotate(-12deg)}33%{transform:translate(var(--a),var(--b)) rotate(14deg)}66%{transform:translate(var(--c),var(--e)) rotate(-10deg)}100%{transform:translate(var(--f),var(--g)) rotate(12deg)}}
.run .stem2{animation:grow 1.8s 4.2s ease-out forwards}
.run .plant{animation-delay:9.5s}
@media(max-width:600px){.petal{filter:none}#moon{right:6%}body{touch-action:manipulation}}
</style>
</head>
<body>
<div id="bokeh"></div><div id="stars"></div><div id="moon"></div><div id="mist"></div>
<div id="fx"></div>
<svg id="s" viewBox="0 0 400 700" aria-label="Büyüyen lilyum">
<defs>
<linearGradient id="gP" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d4e58f"/><stop offset=".1" stop-color="#e0407c"/><stop offset=".45" stop-color="#ff9dc4"/><stop offset=".82" stop-color="#ffdbe9"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="gS" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c9e07f"/><stop offset=".12" stop-color="#d63777"/><stop offset=".5" stop-color="#f68bb6"/><stop offset=".85" stop-color="#ffd0e2"/><stop offset="1" stop-color="#fff5f9"/></linearGradient>
<linearGradient id="gB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6fcf9b"/><stop offset=".5" stop-color="#d9a9c0"/><stop offset="1" stop-color="#ffb8d3"/></linearGradient>
<linearGradient id="gL" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2a7f5b"/><stop offset="1" stop-color="#86dcae"/></linearGradient>
<radialGradient id="gg"><stop offset="0" stop-color="#ff8fbe"/><stop offset="1" stop-color="#ff8fbe" stop-opacity="0"/></radialGradient>
<path id="Pp" d="M0 0 C-26 -14 -46 -50 -37 -82 C-33 -96 -38 -104 -26 -114 C-18 -122 -8 -128 0 -138 C8 -128 18 -122 26 -114 C38 -104 33 -96 37 -82 C46 -50 26 -14 0 0Z"/>
<path id="Ps" d="M0 0 C-20 -16 -34 -55 -24 -92 C-20 -110 -8 -128 0 -146 C8 -128 20 -110 24 -92 C34 -55 20 -16 0 0Z"/>
<g id="V" fill="none" stroke-linecap="round"><path d="M0 -6 C2 -45 -1 -85 0 -124" stroke="#fff" stroke-opacity=".55" stroke-width="2.2"/><path d="M0 -18 C-10 -48 -14 -80 -9 -108" stroke="#b02a64" stroke-opacity=".28" stroke-width="1.1"/><path d="M0 -18 C10 -48 14 -80 9 -108" stroke="#b02a64" stroke-opacity=".28" stroke-width="1.1"/><path d="M-12 -114 C-6 -124 -2 -132 0 -140 C2 -132 6 -124 12 -114" stroke="#fff" stroke-opacity=".5" stroke-width="1.6"/></g>
<g id="D" fill="#8f1d52" fill-opacity=".85"><circle cx="-6" cy="-20" r="1.9"/><circle cx="5" cy="-27" r="2.1"/><circle cx="-3" cy="-37" r="1.7"/><circle cx="8" cy="-44" r="1.8"/><circle cx="-8" cy="-50" r="1.6"/><circle cx="2" cy="-58" r="1.6"/><circle cx="-5" cy="-66" r="1.4"/><circle cx="7" cy="-72" r="1.3"/><circle cx="0" cy="-82" r="1.2"/></g>
<path id="Lf" d="M0 0 C-36 -6 -86 -30 -128 -96 C-70 -80 -24 -44 0 0Z"/>
<path id="Lm" d="M0 0 C-40 -14 -84 -40 -118 -88" fill="none" stroke="#c4f3da" stroke-opacity=".6" stroke-width="1.3"/>
</defs>
<ellipse cx="200" cy="682" rx="70" ry="7" fill="#ff9ec4" opacity=".18"/>
<circle class="seed" cx="200" cy="680" r="6" fill="#ffe1ec"/>
<g class="plant">
<circle class="glow" cx="200" cy="250" r="175" fill="url(#gg)"/>
<path class="stem" d="M200 680 C186 590 216 500 200 330" fill="none" stroke="#3a986d" stroke-width="7" stroke-linecap="round"/>
<g transform="translate(197 610)"><g class="leaf" style="--d:2.4s"><use href="#Lf" fill="url(#gL)"/><use href="#Lm"/></g></g>
<g transform="translate(203 560) scale(-.95 .95)"><g class="leaf" style="--d:2.8s"><use href="#Lf" fill="url(#gL)"/><use href="#Lm"/></g></g>
<g transform="translate(199 505) scale(.8)"><g class="leaf" style="--d:3.2s"><use href="#Lf" fill="url(#gL)"/><use href="#Lm"/></g></g>
<g transform="translate(203 455) scale(-.7 .7)"><g class="leaf" style="--d:3.6s"><use href="#Lf" fill="url(#gL)"/><use href="#Lm"/></g></g>
<path class="stem2" d="M203 470 C226 452 252 430 264 402" fill="none" stroke="#3a986d" stroke-width="4" stroke-linecap="round" style="stroke-dasharray:140;stroke-dashoffset:140"/>
<g transform="translate(264 402) rotate(22) scale(.55)"><path class="leaf" style="--d:5.6s" d="M0 0 C-16 -20 -18 -60 0 -104 C18 -60 16 -20 0 0Z" fill="url(#gB)"/></g>
<g transform="translate(200 332)"><path class="bud" d="M0 0 C-17 -20 -19 -62 0 -108 C19 -62 17 -20 0 0Z" fill="url(#gB)"/></g>
<g transform="translate(200 300) rotate(-6)">
<g transform="scale(1 .68)">
<g transform="rotate(0) scale(.93)"><g class="petal" style="--d:4.3s;--o:20deg"><use href="#Ps" fill="url(#gS)" opacity=".8"/><use href="#D"/></g></g>
<g transform="rotate(60) scale(.93)"><g class="petal" style="--d:4.4s;--o:-20deg"><use href="#Ps" fill="url(#gS)" opacity=".8"/><use href="#D"/></g></g>
<g transform="rotate(120) scale(.93)"><g class="petal" style="--d:4.5s;--o:20deg"><use href="#Ps" fill="url(#gS)" opacity=".8"/><use href="#D"/></g></g>
<g transform="rotate(180) scale(.93)"><g class="petal" style="--d:4.6s;--o:-20deg"><use href="#Ps" fill="url(#gS)" opacity=".8"/><use href="#D"/></g></g>
<g transform="rotate(-120) scale(.93)"><g class="petal" style="--d:4.7s;--o:20deg"><use href="#Ps" fill="url(#gS)" opacity=".8"/><use href="#D"/></g></g>
<g transform="rotate(-60) scale(.93)"><g class="petal" style="--d:4.8s;--o:-20deg"><use href="#Ps" fill="url(#gS)" opacity=".8"/><use href="#D"/></g></g>
<g transform="rotate(-90)"><g class="petal" style="--d:4.5s;--o:-30deg"><use href="#Ps" fill="url(#gS)"/><use href="#V"/><use href="#D"/></g></g>
<g transform="rotate(-150)"><g class="petal" style="--d:4.7s;--o:-40deg"><use href="#Pp" fill="url(#gP)"/><use href="#V"/><use href="#D"/></g></g>
<g transform="rotate(-30)"><g class="petal" style="--d:4.9s;--o:40deg"><use href="#Pp" fill="url(#gP)"/><use href="#V"/><use href="#D"/></g></g>
<g transform="rotate(150)"><g class="petal" style="--d:5.2s;--o:-40deg"><use href="#Ps" fill="url(#gS)"/><use href="#V"/><use href="#D"/></g></g>
<g transform="rotate(30)"><g class="petal" style="--d:5.4s;--o:40deg"><use href="#Ps" fill="url(#gS)"/><use href="#V"/><use href="#D"/></g></g>
<g transform="rotate(90)"><g class="petal" style="--d:5.7s;--o:30deg"><use href="#Pp" fill="url(#gP)"/><use href="#V"/><use href="#D"/></g></g>
<circle r="28" fill="url(#gg)" opacity=".6"/><circle r="15" fill="#a82460" opacity=".75"/><circle r="7" fill="#d4e58f" opacity=".9"/>
</g>
<g stroke="#f6e7b8" stroke-width="1.7" stroke-linecap="round" fill="none">
<g class="st" style="--d:7.4s"><path d="M0 0 Q-22 -28 -50 -52"/><ellipse cx="-51" cy="-54" rx="3.3" ry="8.5" fill="#b4501a" stroke="none" transform="rotate(-48 -51 -54)"/></g>
<g class="st" style="--d:7.6s"><path d="M0 0 Q-12 -42 -30 -80"/><ellipse cx="-31" cy="-82" rx="3.3" ry="8.5" fill="#b4501a" stroke="none" transform="rotate(-24 -31 -82)"/></g>
<g class="st" style="--d:7.8s"><path d="M0 0 Q-2 -48 -4 -96"/><ellipse cx="-4" cy="-98" rx="3.3" ry="8.5" fill="#b4501a" stroke="none"/></g>
<g class="st" style="--d:8s"><path d="M0 0 Q12 -42 30 -80"/><ellipse cx="31" cy="-82" rx="3.3" ry="8.5" fill="#b4501a" stroke="none" transform="rotate(24 31 -82)"/></g>
<g class="st" style="--d:8.2s"><path d="M0 0 Q22 -28 50 -52"/><ellipse cx="51" cy="-54" rx="3.3" ry="8.5" fill="#b4501a" stroke="none" transform="rotate(48 51 -54)"/></g>
<g class="st" style="--d:8.4s"><path d="M0 0 Q6 -52 16 -104" stroke="#fdf6d4" stroke-width="2.6"/><circle cx="16" cy="-106" r="4.6" fill="#a5da78" stroke="none"/><circle cx="16" cy="-106" r="1.8" fill="#e8ffc8" stroke="none"/></g>
</g>
</g>
</g>
</svg>
<svg id="gr"></svg>
<div id="msg"></div>
<script>
const MSG="Üzgünüm, şu an elimden bu geliyor. Bazı ailevi nedenlerden dolayı alamadım, yoksa sana çiçek almak çok isterdim. Yapabildiğimin en iyisi bu, umarım beğenirsin.";
const $=id=>document.getElementById(id),R=Math.random;
let timers=[];
const later=(f,t)=>timers.push(setTimeout(f,t));
function ambient(){
for(let i=0;i<36;i++){const e=document.createElement('i');e.className='star';e.style.cssText=`left:${R()*100}%;top:${R()*80}%;animation-delay:${R()*4}s;animation-duration:${3+R()*4}s`;$('stars').appendChild(e)}
for(let i=0;i<6;i++){const e=document.createElement('i'),z=40+R()*120;e.className='bk';e.style.cssText=`width:${z}px;height:${z}px;left:${R()*100}%;top:${R()*100}%;--x:${(R()-.5)*120}px;--y:${(R()-.5)*160}px;animation-duration:${14+R()*14}s`;$('bokeh').appendChild(e)}}
function heart(){const e=document.createElement('span');e.className='fl';e.innerHTML='<svg viewBox="0 0 24 22" width="'+(14+R()*30)+'"><path d="M12 21C4 14 1 10 1 6.5 1 3.5 3.4 1.5 6 1.5c2.3 0 4.2 1.4 6 3.6 1.8-2.2 3.7-3.6 6-3.6 2.6 0 5 2 5 5 0 3.500-3 7.500-11 14.500z" fill="hsl('+(335+R()*20)+',85%,'+(68+R()*12)+'%)" fill-opacity=".85"/></svg>';e.style.cssText=`left:${R()*100}%;--x:${R()*160-30}px;--r:${(R()-.5)*50}deg;animation-duration:${6+R()*6}s`;$('fx').appendChild(e);setTimeout(()=>e.remove(),15000)}
function butterfly(){const e=document.createElement('div'),r=()=>Math.round((R()-.5)*280)+'px',h=300+R()*60;e.className='bf';
e.innerHTML=`<svg viewBox="0 0 44 36" width="100%" height="100%"><defs><linearGradient id="w${h|0}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},90%,75%)"/><stop offset="1" stop-color="hsl(${h-40},85%,65%)"/></linearGradient></defs><g class="w"><path d="M22 18C14 4 3 3 2 10c-1 8 8 9 20 8zM22 18C15 28 6 33 4 27c-2-6 6-10 18-9z" fill="url(#w${h|0})"/><path d="M22 18C30 4 41 3 42 10c1 8-8 9-20 8zM22 18C29 28 38 33 40 27c2-6-6-10-18-9z" fill="url(#w${h|0})"/><circle cx="9" cy="11" r="2.4" fill="#fff" fill-opacity=".6"/><circle cx="35" cy="11" r="2.4" fill="#fff" fill-opacity=".6"/><circle cx="8" cy="26" r="1.6" fill="#fff" fill-opacity=".5"/><circle cx="36" cy="26" r="1.6" fill="#fff" fill-opacity=".5"/></g><rect x="21" y="10" width="2" height="16" rx="1" fill="#3a1c4a"/><path d="M22 11C20 6 17 4 15 3M22 11C24 6 27 4 29 3" stroke="#3a1c4a" stroke-width=".9" fill="none" stroke-linecap="round"/></svg>`;
e.style.cssText=`left:${15+R()*65}%;top:${12+R()*45}%;--a:${r()};--b:${r()};--c:${r()};--e:${r()};--f:${r()};--g:${r()};width:${30+R()*36}px;height:auto;aspect-ratio:44/36;animation-duration:${9+R()*7}s`;$('fx').appendChild(e)}
function type(i=0){if(i<=MSG.length){$('msg').textContent=MSG.slice(0,i);later(()=>type(i+1),55)}}
function start(){
$('s').classList.add('run');
later(()=>{for(let i=0;i<10;i++)later(butterfly,i*400);for(let i=0;i<6;i++)later(heart,i*150);timers.push(setInterval(heart,innerWidth<600?600:380));timers.push(setInterval(()=>{const b=document.querySelectorAll('.bf');if(b.length>=10)b[0].remove();butterfly()},3500))},1000);
later(()=>type(),1200);
later(()=>{for(let i=0;i<(innerWidth<600?6:12);i++)later(firefly,i*350);timers.push(setInterval(pollen,450));timers.push(setInterval(petal,1500));timers.push(setInterval(shoot,5500))},7500);later(shoot,3000)}
const add=(c,css,ttl,html='')=>{const e=document.createElement('i');e.className=c;e.style.cssText=css;e.innerHTML=html;$('fx').appendChild(e);if(ttl)setTimeout(()=>e.remove(),ttl)};
function firefly(){add('ff',`left:${5+R()*90}%;top:${20+R()*55}%;--x:${(R()-.5)*160}px;--y:${(R()-.5)*120}px;animation-duration:${6+R()*6}s,${1.8+R()*2}s`)}
function pollen(){add('pl',`left:${50+(R()-.5)*8}%;top:34%;--x:${-20+R()*140}px;--y:${-60-R()*140}px;animation-duration:${3+R()*3}s`,6500)}
function petal(){add('pt',`left:${46+R()*8}%;top:36%;--x:${40+R()*220}px;--y:${innerHeight*.45}px;--r:${(R()-.5)*720}deg;width:${10+R()*8}px;height:${14+R()*10}px;animation-duration:${7+R()*4}s`,12000)}
function shoot(){add('sh',`left:${R()*50}%;top:${5+R()*25}%;--r:25deg;--x:${300+R()*200}px;--y:${150+R()*100}px`,1600)}
function burst(x,y){for(let i=0;i<12;i++){const a=R()*6.283,d=60+R()*110;add('bh',`left:${x}px;top:${y}px;--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`,1400,`<svg viewBox="0 0 24 22" width="${12+R()*14}"><path d="M12 21C4 14 1 10 1 6.5 1 3.5 3.4 1.5 6 1.5c2.3 0 4.2 1.4 6 3.6 1.8-2.2 3.7-3.6 6-3.6 2.6 0 5 2 5 5 0 3.500-3 7.500-11 14.500z" fill="hsl(${335+R()*20},85%,72%)"/></svg>`)}if(R()<.4)butterfly()}
function grass(){const W=innerWidth,H=innerHeight*(innerWidth<600?.055:.06),g=$('gr');g.setAttribute('viewBox',`0 0 ${W} ${innerHeight*.28}`);let s=`<defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f4a3a"/><stop offset="1" stop-color="#0b0820" stop-opacity=".9"/></linearGradient></defs><rect y="${H-2}" width="${W}" height="${innerHeight*.28-H+2}" fill="url(#gd)"/>`;
for(let l=0;l<3;l++){s+=`<g class="b" style="--t:${3+l*.9}s;animation-delay:-${l*1.3}s">`;for(let i=0;i<W/(l?2.2:1.8);i++){const x=R()*W,h=H*(.3+l*.2+R()*.35),d=(R()-.5)*16;s+=`<path d="M${x} ${H}Q${x+d*.3} ${H-h*.6} ${x+d} ${H-h}" stroke="hsl(${125+R()*35},${40+l*8}%,${14+l*10+R()*12}%)" stroke-width="${1.7+l*.6}" fill="none" stroke-linecap="round"/>`}s+='</g>'}
for(let i=0;i<W/30;i++){const x=R()*W,h=H*(.5+R()*.4),c=R()<.5?'#fff':'#ffb3d1';s+=`<g class="b" style="animation-delay:-${R()*3}s;--t:${3+R()*2}s"><path d="M${x} ${H}L${x} ${H-h}" stroke="#3a986d" stroke-width="1.5"/>`+[0,1,2,3,4].map(k=>`<ellipse cx="${x}" cy="${H-h-4}" rx="2.6" ry="5.5" fill="${c}" transform="rotate(${k*72} ${x} ${H-h})"/>`).join('')+`<circle cx="${x}" cy="${H-h}" r="2" fill="#ffd95a"/></g>`}g.innerHTML=s}
ambient();grass();start();
document.body.addEventListener('pointerdown',e=>burst(e.clientX,e.clientY));
</script>
</body>
</html>
